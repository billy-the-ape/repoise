name: Release preparation and staging
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag merged into main (e.g. v0.1.0-alpha.0)
        required: true
        type: string
      stage_npm:
        description: Stage npm packages through OIDC (maintainer approval remains separate)
        type: boolean
        default: false
      draft_native:
        description: Create an unpublished native GitHub release draft
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'billy-the-ape/repoise'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup show
      - name: Validate version tag and main ancestry
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/check-tag.mjs
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup show
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --package repoise-cli --locked --target ${{ matrix.target }}
      - name: Package binary and test installed tarballs
        run: |
          node scripts/release/pack.mjs ${{ matrix.target }}
          node scripts/release/smoke.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ matrix.target }}/*.tgz
            dist/${{ matrix.target }}/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/bundle
          merge-multiple: true
      - run: rustup show
      - name: Assemble exact release bundle and checksums
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/release/assemble.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/bundle/
          if-no-files-found: error
          retention-days: 14
  stage:
    if: inputs.stage_npm
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/bundle
      - name: Stage native packages, then launcher (OIDC)
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node scripts/release/publish.mjs
  native-draft:
    if: inputs.draft_native
    needs: [prepare, assemble]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist/bundle
      - name: Create unpublished native release draft
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/github-draft.mjs
