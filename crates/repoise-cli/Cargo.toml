[package]
name = "repoise-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
description = "Native Repoise command-line adapter"

[[bin]]
name = "repoise"
path = "src/main.rs"

[features]
default = ["remote-embedding", "github-enrichment"]
# HTTPS transport for the OpenAI-compatible embedding provider. Disabling it
# removes the network stack from the binary; lexical operation is unaffected.
remote-embedding = ["ureq"]
# HTTPS transport for the verified GitHub history enrichment provider.
# Disabling it keeps commit-to-PR hints unverified; local indexing is
# unaffected.
github-enrichment = ["ureq"]

[dependencies]
repoise-core.workspace = true
ctrlc.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "json"], optional = true }

[lints]
workspace = true
