name: Claude Code Review
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
jobs:
  review:
    uses: billy-the-ape/claude-plugins/.github/workflows/claude-review.yml@main
    secrets: inherit
    with:
      pr_number: ${{ inputs.pr_number }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
      statuses: write