# JS/TS workspace membership is explicit. See
# docs/plans/agent-platform/01-workspace-and-ci.md for ownership and reserved
# homes. Generated native-package staging (dist/), evaluation fixtures and
# consumer examples never join the workspace. The root package is listed so
# Turborepo schedules its declared development and native-bridge tasks; pnpm
# always treats the root as a workspace member.
packages:
  - . # root development package (private; never published)
  - npm/repoise # published thin launcher; name/bin/pins preserved
  - "apps/*" # reserved for application packages (e.g. apps/vscode)
  - "packages/*" # reserved for library/adapter packages
