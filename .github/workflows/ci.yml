name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm test
      - name: Install pinned toolchain
        run: rustup show
      - name: Check (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/check.sh
      - name: Check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke native executable (Unix)
        if: runner.os != 'Windows'
        run: ./target/release/repoise --version
      - name: Smoke native executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/release/repoise.exe --version
      - name: Prepare claim tarball (no registry write)
        run: npm run release:claim
      - name: Package Unix native binary
        if: runner.os != 'Windows'
        run: node scripts/release/pack.mjs ${{ matrix.target }} target/release/repoise
      - name: Package Windows native binary
        if: runner.os == 'Windows'
        run: node scripts/release/pack.mjs ${{ matrix.target }} target/release/repoise.exe
      - name: Smoke packed tarballs and native archive
        run: node scripts/release/smoke.mjs ${{ matrix.target }}
