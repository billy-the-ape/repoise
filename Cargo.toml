[workspace]
members = ["crates/repoise-core", "crates/repoise-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/billy-the-ape/repoise"
publish = false
license = "MIT"

[workspace.dependencies]
repoise-core = { path = "crates/repoise-core" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
